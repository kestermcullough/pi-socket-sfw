name: POSIX setup tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Node version
        run: node --version
      - name: Test mocked setup (no SFW installation or registry downloads)
        run: node --test tests/*.test.mjs
      - name: Check script syntax
        run: |
          node --check skills/socket-sfw/scripts/setup-pi-sfw.mjs
          bash -n skills/socket-sfw/scripts/install-sfw-aliases.sh
